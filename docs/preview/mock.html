:root{
  --bg:#0A100D; --surface:#121A16; --surface2:#17221D;
  --stroke:#223129; --stroke2:#2C4137;
  --text:#ECF5F0; --body:#E4EFE9; --dim:#9DB3A8; --faint:#668074;
  --accent:#34E8AC; --accent-ink:#04221A; --accent-soft:#12271E; --accent-line:#1F5C46;
  --danger:#FF7B74; --danger-soft:#2E1B1A;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:26px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 700px at 50% -10%, #113228 0%, #0A110E 55%, #060A08 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;gap:34px;
  padding:28px 16px;color:var(--text);flex-wrap:wrap;
}
.i{font-family:'MDI';font-style:normal;font-weight:normal;line-height:1;display:inline-block}
.i16{font-size:16px}.i18{font-size:18px}.i20{font-size:20px}.i22{font-size:22px}.i26{font-size:26px}
.i38{font-size:38px}.i46{font-size:46px}.i52{font-size:52px}
.accent{color:var(--accent)}.danger{color:var(--danger)}.dim{color:var(--dim)}

/* ---------- stage / controls ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.side{display:flex;flex-direction:column;gap:10px;min-width:230px}
.side h2{font-size:15px;letter-spacing:.4px;color:var(--accent)}
.side .hint{font-size:12px;color:var(--faint);line-height:1.5}
.side-group{display:flex;flex-wrap:wrap;gap:6px}
.ctrl{
  border:1px solid var(--stroke);background:var(--surface);color:var(--dim);
  font-size:12px;font-weight:600;border-radius:10px;padding:7px 11px;cursor:pointer;transition:.15s;
}
.ctrl:hover{color:var(--text);border-color:var(--stroke2)}
.ctrl.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.side-sep{height:1px;background:var(--stroke);margin:4px 0}

/* ---------- phone frame ---------- */
.frame{
  width:392px;height:812px;max-height:86vh;background:var(--bg);
  border-radius:44px;border:1px solid #20362C;
  box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #0A120E;
  overflow:hidden;position:relative;display:flex;flex-direction:column;
}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#060A08;border-radius:20px;z-index:60}
.statusbar{height:42px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 4px;font-size:11px;color:var(--faint);flex:none}
.screens{position:relative;flex:1;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .22s, transform .22s;transform:translateY(8px);overflow:hidden}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.scroll{flex:1;overflow-y:auto;padding:6px 20px 26px;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:var(--stroke2);border-radius:2px}

/* ---------- typography ---------- */
.display{font-size:30px;font-weight:800;letter-spacing:.3px}
.h1{font-size:24px;font-weight:800}.h2{font-size:20px;font-weight:700}.h3{font-size:17px;font-weight:700}
.title{font-size:17px;font-weight:700}
.body{font-size:15px}.footnote{font-size:13px}
.muted{color:var(--dim)}.faintc{color:var(--faint)}
.center{text-align:center}
.eyebrow{font-size:11px;color:var(--faint);font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin:18px 0 6px}

/* ---------- shared components ---------- */
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-lg);padding:16px;margin-top:12px}
.card-title{font-size:15px;font-weight:700}
.card-text{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.4}

.topbar{padding:8px 12px 10px;flex:none}
.topbar-row{display:flex;align-items:center;gap:8px}
.topbar-title{flex:1;text-align:center;font-size:17px;font-weight:800}
.topbar-sub{font-size:12px;color:var(--faint);text-align:center;margin-top:4px}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;border:none;color:var(--dim)}
.iconbtn:active{opacity:.7}
.spacer40{width:40px;flex:none}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-size:15px;font-weight:700;letter-spacing:.3px;border:none;border-radius:16px;
  padding:14px 22px;margin-top:14px;cursor:pointer;font-family:inherit;transition:.15s;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface2);color:var(--text)}
.btn-outline{background:transparent;border:1.5px solid var(--stroke2);color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--stroke);border-radius:12px;padding:3px;gap:2px}
.seg-item{border:none;background:transparent;color:var(--dim);font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:9px;cursor:pointer;font-family:inherit}
.seg-item.on{background:#1F3B2F;color:var(--accent)}

.chip{display:inline-flex;align-items:center;background:var(--surface2);border:1px solid var(--stroke);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--dim);cursor:pointer;gap:5px;white-space:nowrap}
.chip .n{color:var(--faint);font-weight:800}
.chip.on{background:#143529;border-color:var(--accent);color:var(--accent)}
.chip.on .n{color:#2FBF91}

.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 14px;margin:8px 0 0}
.banner-ok{background:#103227;border:1px solid #1F5C46}
.banner-err{background:var(--danger-soft);border:1px solid #5C2B28}
.banner-text{font-size:13px;color:var(--body);line-height:1.4}

.searchrow{display:flex;gap:8px;margin:2px 0 0}
.searchwrap{flex:1;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:14px;padding:0 12px}
.searchwrap input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;padding:9px 0;font-family:inherit}
.searchwrap input::placeholder{color:#5E786D}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* file items */
.fileitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid transparent;border-radius:16px;padding:10px;margin-bottom:10px;cursor:pointer;transition:.12s}
.fileitem:hover{border-color:var(--stroke2)}
.fileitem.sel{border-color:var(--accent);background:#13251D}
.badge{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.badge .thumb{width:100%;height:100%;object-fit:none}
.finfo{flex:1;min-width:0}
.fname{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{font-size:11.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#3D5348;font-size:20px}
.cat-image{background:#142631;color:#6FCAFF}
.cat-video{background:#221A33;color:#B28BFF}
.cat-audio{background:#2B2113;color:#FFB35C}
.cat-document{background:#123029;color:#5CE0C0}
.cat-archive{background:#2B1A20;color:#FF8FA6}
.cat-other{background:#1A231F;color:#9DB3A8}

.gridwrap{display:flex;flex-wrap:wrap;gap:10px}
.tile{width:calc(33.33% - 7px);background:var(--surface);border:1.5px solid transparent;border-radius:16px;padding:8px;cursor:pointer}
.tile.sel{border-color:var(--accent)}
.tile .badge{width:100%;height:86px;border-radius:12px;margin-bottom:8px}
.tile .fname{font-size:11.5px;white-space:normal;line-height:1.25}
.tile .fmeta{font-size:10.5px}

.fab{position:absolute;right:20px;bottom:24px;width:58px;height:58px;border-radius:29px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(52,232,172,.35);cursor:pointer;border:none}
.fab:active{transform:scale(.94)}

.selbar{display:flex;align-items:center;gap:4px;background:#14251E;border:1px solid var(--stroke2);border-radius:16px;padding:8px 10px;margin:4px 0 0}
.selcount{flex:1;font-size:14px;font-weight:700;padding-left:4px}
.selbtn{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--accent);background:none;border:none;cursor:pointer;padding:8px 10px;border-radius:10px;font-family:inherit}


/* home / dashboard */
.filescard{padding:16px;margin-top:0;display:flex;align-items:center;gap:14px}
.filesic{width:52px;height:52px;border-radius:15px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
.filesic.on{background:#143529}
.minichips{display:flex;flex-wrap:wrap;margin-top:8px}
.minichip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 9px;margin:0 6px 6px 0}
.minichip .n{font-size:11px;font-weight:800;color:var(--text)}
.actiontiles{display:flex;gap:10px}
.actiontile{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--stroke);border-radius:18px;padding:16px 10px;cursor:pointer}
.actiontile.accent-t{background:var(--accent-soft);border-color:var(--accent-line)}
.actiontile:active{transform:scale(.98)}
.actionlabel{font-size:13px;font-weight:700}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 30px;text-align:center}
.empty .glyph{width:108px;height:108px;border-radius:32px;background:var(--surface);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center}

/* pin pad */
.pindots{display:flex;justify-content:center;gap:20px;margin:14px 0 18px}
.pindot{width:13px;height:13px;border-radius:50%;border:2px solid #3A4F45}
.pindot.f{background:var(--accent);border-color:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,84px);justify-content:center;gap:10px}
.pinkey{height:64px;border-radius:16px;background:var(--surface);color:var(--text);font-size:24px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.pinkey.aux{background:transparent;color:var(--faint)}
.pinkey:active{opacity:.6}

/* pattern */
.pattern{position:relative;width:282px;height:282px;margin:10px auto}
.pdot{position:absolute;width:54px;height:54px;border-radius:27px;background:#131F1A;border:2px solid var(--stroke2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;font-weight:800;color:var(--accent)}
.pdot.on{background:#143529;border-color:var(--accent)}
.pdot.last{border-color:#7AFFD2}
.pline{position:absolute;height:4px;background:var(--accent);border-radius:2px;transform-origin:0 50%}

/* steps */
.steps{display:flex;gap:8px;margin-top:12px}
.stepc{flex:1}
.stepbar{height:4px;border-radius:2px;background:var(--stroke)}
.stepbar.on{background:var(--accent)}
.steplab{font-size:11px;font-weight:700;color:var(--faint);text-align:center;margin-top:5px}
.steplab.on{color:var(--accent)}

/* methods */
.method{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--stroke);border-radius:18px;padding:14px;margin-top:10px;cursor:pointer}
.method.sel{border-color:var(--accent);background:var(--accent-soft)}
.method .mic{width:44px;height:44px;border-radius:13px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
.method .radio{margin-left:auto;color:var(--faint)}
.method.sel .radio{color:var(--accent)}

/* detail */
.detailbadge{width:112px;height:112px;border-radius:28px}
.metarow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--stroke);font-size:13px}
.metarow:last-child{border-bottom:none}
.metarow .k{color:var(--dim);flex:1}
.detailimg{width:100%;height:230px;border-radius:18px;object-fit:cover;margin-top:8px}

/* lock */
.lockhero{display:flex;flex-direction:column;align-items:center;padding:26px 20px 8px;gap:2px}
.logobadge{width:84px;height:84px;border-radius:24px;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.biobtn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;padding:12px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);font-size:14px;font-weight:700;cursor:pointer}
.forgot{display:flex;justify-content:center;gap:4px;margin-top:22px;font-size:13px}
.forgot .a{color:#7E968A;font-weight:600}.forgot .b{color:var(--accent);font-weight:700;cursor:pointer}

.footerbtn{padding:16px 20px 22px;flex:none}
.hintpill{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:rgba(10,16,13,.85);border:1px solid var(--stroke2);color:var(--faint);font-size:10.5px;padding:4px 10px;border-radius:999px;z-index:50;pointer-events:none}
</style>

.fld:focus{border-color:var(--stroke2)}
.fld::placeholder{color:#5E786D}
.showhide{display:flex;justify-content:flex-end;gap:5px;align-items:center;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;padding:6px 2px}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:none}

.switch input:checked+span{background:#1F5C46}
.switch input:checked+span:before{background:var(--accent);transform:translateX(20px)}

/* ========= i18n ========= */
function plural(n){ return S.lang==='fr' ? (n===0||n===1?'one':'other') : (n===1?'one':'other'); }
function t(key, params){
  const d = T[S.lang];
  let k = key;
  if (params && typeof params.n === 'number'){
    const one = key+'_one', other = key+'_other';
    if (plural(params.n)==='one' && d[one]) k = one; else if (d[other]) k = other;
  }
  let out = d[k] || T.en[k] || key;
  if (params) for (const [n,v] of Object.entries(params)) out = out.split('{'+n+'}').join(v);
  return out;
}
const MONTHS = { en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
                 fr:['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'] };
function fmtDate(ts){
  const d=new Date(ts), p=x=>String(x).padStart(2,'0'), m=MONTHS[S.lang][d.getMonth()];
  return S.lang==='fr' ? `${d.getDate()} ${m} ${d.getFullYear()} · ${p(d.getHours())}:${p(d.getMinutes())}`
                       : `${m} ${d.getDate()}, ${d.getFullYear()} · ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const UNITS = { en:['B','KB','MB','GB','TB'], fr:['o','Ko','Mo','Go','To'] };
function fmtBytes(n){
  if(!n||n<0) return '0 '+UNITS[S.lang][0];
  const u=UNITS[S.lang]; let i=0,v=n;
  while(v>=1024&&i<u.length-1){v/=1024;i++;}
  const num=i===0?Math.round(v)+'':v.toFixed(1).replace('.', S.lang==='fr'?',':'.');
  return `${num} ${u[i]}`;
}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function applyLang(){
  $$('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $$('[data-placeholder]').forEach(el => el.placeholder = t(el.dataset.placeholder));
  $$('.seg-item[data-setlang]').forEach(b => b.classList.toggle('on', b.dataset.setlang===S.lang));
  localStorage.setItem('sv.lang', S.lang);

}

/* ========= setup ========= */
function renderSetup(){
  const st = S.setupStep;
  $('#setupTitle').textContent = t('setup.create.title');
  $('#setupSub').textContent = st===0 ? t('setup.method.subtitle') : st===1 ? promptText() : t('setup.confirm.subtitle');
  [0,1,2].forEach(i=>{
    $('#stb'+i).classList.toggle('on', st>=i);
    $('#stl'+i).classList.toggle('on', st===i);
    $('#stl'+i).textContent = t(['setup.step.method','setup.step.enter','setup.step.confirm'][i]);
  });
  $('#setupMethod').style.display = st===0 ? '' : 'none';
  $('#setupEnter').style.display = st===1 ? '' : 'none';
  $('#setupConfirm').style.display = st===2 ? '' : 'none';
  $$('#setupMethod .method').forEach(m=>{
    m.classList.toggle('sel', m.dataset.method===S.setupChosen);
    m.querySelector('.mic .i').className = `i i22 ${m.dataset.method===S.setupChosen?'accent':'dim'} ${m.dataset.method==='password'?'i-keyOutline':m.dataset.method==='pin'?'i-dialpad':'i-gesture'}`;
  });
  const m = S.setupChosen || 'password';
  $('#enterPassword').style.display = m==='password'&&st===1?'':'none';
  $('#enterPin').style.display        = m==='pin'&&st===1?'':'none';
  $('#enterPattern').style.display    = m==='pattern'&&st===1?'':'none';
  $('#confirmPassword').style.display = m==='password'&&st===2?'':'none';
  $('#confirmPin').style.display      = m==='pin'&&st===2?'':'none';
  $('#confirmPattern').style.display  = m==='pattern'&&st===2?'':'none';
  renderDots('#pinDots1', S.setupPin.length, Math.max(4,S.setupPin.length));
  renderDots('#pinDots2', S.setupPin2.length, Math.max(4,S.setupPin.length||4));
  $('#patCount1').textContent = t('setup.pattern.dots',{n:Math.max(1,S.setupPattern.length)});
  $('#patCount2').textContent = t('setup.pattern.dots',{n:Math.max(1,S.setupPattern2.length)});
  $('#setupCta').textContent = st===2 ? t('setup.cta.save') : t('setup.cta.continue');
  $('#setupError').style.display = 'none';
}
function promptText(){
  const m=S.setupChosen;
  return m==='password'?t('setup.prompt.password'):m==='pin'?t('setup.prompt.pin'):t('setup.prompt.pattern');
}
function setupNext(){
  const st=S.setupStep, m=S.setupChosen;
  if(st===0){
    if(!m){ setupErr(t('setup.error.pickMethod')); return; }
    S.setupStep=1;
  } else if(st===1){
    const ok = m==='password' ? $('#pw1').value.length>=6 : m==='pin' ? S.setupPin.length>=4 : S.setupPattern.length>=4;
    if(!ok){ setupErr(promptText()); return; }
    S.setupStep=2;
  } else {
    let a,b;
    if(m==='password'){a=$('#pw1').value;b=$('#pw2').value;}
    else if(m==='pin'){a=S.setupPin;b=S.setupPin2;}
    else {a=S.setupPattern;b=S.setupPattern2;}
    if(a!==b){ setupErr(m==='pattern'?t('setup.error.mismatchPattern'):t('setup.error.mismatch')); S.setupPin2='';S.setupPattern2=''; return; }
    S.method=m; goto('lock'); return;
  }
  renderSetup();
}
function setupErr(msg){
  $('#setupError').style.display='';
  $('#setupErrorText').textContent=msg;
}
function setupBackFn(){
  if(S.setupStep===0){ goto('welcome'); return; }
  S.setupStep--; S.setupPin2='';S.setupPattern2=''; renderSetup();
}

/* pin pads */
function renderDots(sel, filled, total){
  const el=$(sel); if(!el) return;
  el.innerHTML = Array.from({length:total},(_,i)=>`<span class="pindot ${i<filled?'f':''}"></span>`).join('');
}
function buildPad(sel, onDigit, onBack){
  const el=$(sel);
  el.innerHTML='';
  const keys=['1','2','3','4','5','6','7','8','9','','0','back'];
  keys.forEach(k=>{
    const b=document.createElement('button');
    b.className='pinkey'+(k===''||k==='back'?' aux':'');
    b.innerHTML = k==='back' ? '<span class="i i24 i-backspace"></span>' : (k||'&nbsp;');
    if(k) b.onclick=()=> k==='back' ? onBack() : onDigit(k);
    el.appendChild(b);
  });
}

/* pattern */
function buildPattern(sel, get, set){
  const el=$(sel);
  el.innerHTML='';
  const C=[73,141,209], D=54;
  const dots=[];
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    const d=document.createElement('div');
    d.className='pdot'; d.style.left=(C[c]-D/2)+'px'; d.style.top=(C[r]-D/2)+'px';
    d.dataset.i=r*3+c+1; el.appendChild(d); dots.push(d);
  }
  const paint=()=>{
    const seq=get(); const last=seq.slice(-1);
    dots.forEach(d=>{
      const i=+d.dataset.i, idx=seq.indexOf(''+i);
      d.classList.toggle('on',idx>=0);
      d.classList.toggle('last', i===+last);
      d.textContent = idx>=0 ? idx+1 : '';
    });
    // lines
    el.querySelectorAll('.pline').forEach(l=>l.remove());
    for(let k=1;k<seq.length;k++){
      const a=dots[+seq[k-1]-1].getBoundingClientRect(), b=dots[+seq[k]-1].getBoundingClientRect();
      const ax=C[(+seq[k-1]-1)%3], ay=C[Math.floor((+seq[k-1]-1)/3)];
      const bx=C[(+seq[k]-1)%3], by=C[Math.floor((+seq[k]-1)/3)];
      const len=Math.hypot(bx-ax,by-ay), ang=Math.atan2(by-ay,bx-ax)*180/Math.PI;
      const l=document.createElement('div');
      l.className='pline'; l.style.left=ax+'px'; l.style.top=(ay-2)+'px';
      l.style.width=len+'px'; l.style.transform=`rotate(${ang}deg)`;
      el.appendChild(l);
    }
  };
  dots.forEach(d=> d.onclick=()=>{
    const i=''+d.dataset.i; let seq=get();
    const idx=seq.indexOf(i);
    if(idx>=0) seq=seq.slice(0,idx+1); else seq+=i;
    set(seq); paint();
  });
  paint();
  return paint;
}

/* ========= lock ========= */
function renderLock(){
  const m=S.method;
  $('#lockPrompt').textContent = t(m==='password'?'lock.prompt.password':m==='pin'?'lock.prompt.pin':'lock.prompt.pattern');
  $('#lockPassword').style.display = m==='password'?'':'none';
  $('#lockPin').style.display = m==='pin'?'':'none';
  $('#lockPattern').style.display = m==='pattern'?'':'none';
  $('#bioBtn').style.display = S.bio ? '' : 'none';
  $('#lockHint').textContent = m==='pin'?'demo PIN: 1234':m==='password'?'demo password: demo':'demo pattern: 1·4·7·8·9';
  renderDots('#pinDotsL', 0, 4);
  let pin=''; window.__lockPin = pin;
  buildPad('#pinPadL', d=>{
    if(window.__lockPin.length>=4) return;
    window.__lockPin+=d; renderDots('#pinDotsL', window.__lockPin.length, 4);
    if(window.__lockPin.length===4) setTimeout(()=>tryUnlock(window.__lockPin),200);
  }, ()=>{ window.__lockPin=window.__lockPin.slice(0,-1); renderDots('#pinDotsL', window.__lockPin.length,4); });
  buildPattern('#patternGridL', ()=>window.__lockPattern||'', v=>window.__lockPattern=v);
  window.__lockPattern=''; window.__lockPin='';
  $('#lockError').style.display='none';
}
function tryUnlock(secret){
  if(secret===SECRETS[S.method]){ goto('home'); return; }
  $('#lockError').style.display='';
  $('#lockErrorText').textContent = t('lock.wrong',{method:methodWord(),n:3});
  window.__lockPin=''; window.__lockPattern='';
  renderLock();
}
function methodWord(){ return t(S.method==='password'?'method.password':S.method==='pin'?'method.pin':'method.pattern'); }

/* ========= vault ========= */
function visibleFiles(){
  const q=S.q.trim().toLowerCase();
  let list=FILES.filter(f=> !S.vaultEmpty && (S.filter==='all'||f.cat===S.filter) && (!q||f.name.includes(q)));
  const sorters={ newest:(a,b)=>b.at-a.at, oldest:(a,b)=>a.at-b.at, name:(a,b)=>a.name.localeCompare(b.name), largest:(a,b)=>b.size-a.size };
  return [...list].sort(sorters[S.sort]);
}
function renderVault(){
  const list=visibleFiles();
  const total=S.vaultEmpty?0:FILES.length, bytes=S.vaultEmpty?0:FILES.reduce((s,f)=>s+f.size,0);
  $('#vaultCount').textContent = `${t('vault.count',{n:total})}  ·  ${fmtBytes(bytes)}`;
  $('#viewIcon').className = `i i20 ${S.view==='list'?'i-grid':'i-list'}`;

  // chips
  const cats=[...new Set(FILES.map(f=>f.cat))];
  $('#vaultChips').innerHTML =
    `<span class="chip ${S.filter==='all'?'on':''}" data-f="all">${t('cat.all')}<span class="n">${total}</span></span>`+
    cats.map(c=>`<span class="chip ${S.filter===c?'on':''}" data-f="${c}">${t(CATKEY[c])}<span class="n">${FILES.filter(f=>f.cat===c).length}</span></span>`).join('');
  $$('#vaultChips .chip').forEach(ch=> ch.onclick=()=>{ S.filter=ch.dataset.f; renderVault(); });

  // tools vs selection bar
  $('#vaultTools').style.display = S.selection?'none':'';
  $('#vaultChips').style.display = S.selection?'none':'';
  $('#selBar').style.display = S.selection?'':'none';
  $('#selCount').textContent = t('vault.sel.count',{n:S.selected.size});
  $('#fab').style.display = (!S.vaultEmpty && !S.selection)?'':'none';

  const empty=$('#vaultEmpty');
  if(S.vaultEmpty || list.length===0){
    $('#vaultList').style.display='none'; $('#vaultGrid').style.display='none';
    empty.style.display='';
    if(!S.vaultEmpty && FILES.length>0){
      empty.querySelector('.glyph').innerHTML='<span class="i i46 dim i-search"></span>';
      empty.querySelector('.h2').textContent=t('vault.noResults.title');
      empty.querySelector('.footnote').textContent=t('vault.noResults.text');
      empty.querySelector('.btn').style.display='none';
    } else {
      empty.querySelector('.glyph').innerHTML='<span class="i i46 dim i-database"></span>';
      empty.querySelector('.h2').textContent=t('vault.empty.title');
      empty.querySelector('.footnote').textContent=t('vault.empty.text');
      empty.querySelector('.btn').style.display='';
    }
    return;
  }
  empty.style.display='none';

  const meta=f=>`${fmtBytes(f.size)}  ·  ${t(CATKEY[f.cat])}  ·  ${fmtDate(f.at)}`;
  const badge=f=> f.th
    ? `<span class="badge" style="background:${f.th}"></span>`
    : `<span class="badge cat-${f.cat}"><span class="i i22 ${CATICON[f.cat]}"></span></span>`;

  if(S.view==='list'){
    $('#vaultGrid').style.display='none'; $('#vaultList').style.display='';
    $('#vaultList').innerHTML = list.map((f,i)=>`
      <div class="fileitem ${S.selected.has(i)?'sel':''}" data-i="${i}">
        ${badge(f)}
        <span class="finfo"><span class="fname">${esc(f.name)}</span><span class="fmeta">${meta(f)}</span></span>
        <span class="i i20 ${S.selected.has(i)?'accent':''}" style="color:${S.selected.has(i)?'var(--accent)':'#3D5348'}">${S.selected.has(i)?'&#xF012C;':'&#xF0142;'}</span>
      </div>`).join('');
    $$('#vaultList .fileitem').forEach(el=> el.onclick=()=>itemTap(+el.dataset.i));
  } else {
    $('#vaultList').style.display='none'; $('#vaultGrid').style.display='';
    $('#vaultGrid').innerHTML = list.map((f,i)=>`
      <div class="tile ${S.selected.has(i)?'sel':''}" data-i="${i}">
        ${badge(f)}
        <span class="fname">${esc(f.name)}</span>
        <span class="fmeta">${fmtBytes(f.size)} · ${fmtDate(f.at).split('·')[0]}</span>
      </div>`).join('');
    $$('#vaultGrid .tile').forEach(el=> el.onclick=()=>itemTap(+el.dataset.i));
  }
}
function itemTap(i){
  if(S.selection){
    S.selected.has(i)?S.selected.delete(i):S.selected.add(i);
    if(S.selected.size===0) S.selection=false;
    renderVault();
  } else {
    S.demoIdx=i; renderDetail(); goto('detail');
  }
}

/* ========= detail ========= */
function renderDetail(){
  const f=visibleFiles()[S.demoIdx]||FILES[0];
  $('#detailPreview').innerHTML = f.th
    ? `<div class="detailimg" style="background:${f.th}"></div>`
    : `<div class="badge detailbadge cat-${f.cat}"><span class="i i46 ${CATICON[f.cat]}"></span></div>`;
  $('#detailName').textContent=f.name;
  $('#dSize').textContent=fmtBytes(f.size);
  $('#dDate').textContent=fmtDate(f.at);
  $('#dMoved').textContent=t(f.moved?'detail.original.deleted':'detail.original.kept');
  $('#dMoved').style.color=f.moved?'var(--accent)':'#FFB35C';
  $('#dNote').textContent=t(f.moved?'detail.note.deleted':'detail.note.kept');
  $('#detailBanner').innerHTML='';
}

/* ========= settings ========= */
function renderSettings(){
  $('#setMethodIcon').className = `i i22 accent ${S.method==='password'?'i-keyOutline':S.method==='pin'?'i-dialpad':'i-gesture'}`;
  $('#setMethodLabel').textContent = t(S.method==='password'?'setup.method.password':S.method==='pin'?'setup.method.pin':'setup.method.pattern')+' · '+t('settings.lock.changeHint');
  const count=S.vaultEmpty?0:FILES.length, bytes=S.vaultEmpty?0:FILES.reduce((s,f)=>s+f.size,0);
  $('#setStorage').textContent = `${t('vault.count',{n:count})}  ·  ${fmtBytes(bytes)}`;
  $('#aboutLine').textContent = t('settings.about',{version:'1.0.0'});
  const rows=[['i-security','settings.privacy.p1'],['i-syncOff','settings.privacy.p2'],['i-lockReset','settings.privacy.p3'],['i-clock','settings.privacy.p4']];
  $('#privacyList').innerHTML = rows.map(([ic,k])=>`
    <div style="display:flex;gap:12px;margin-top:8px">
      <span class="i i18 accent ${ic}" style="margin-top:2px"></span><span class="card-text" style="flex:1">${t(k)}</span>
    </div>`).join('');
}

/* ========= home / dashboard ========= */
function renderHome(){
  const total=S.vaultEmpty?0:FILES.length, bytes=S.vaultEmpty?0:FILES.reduce((s,f)=>s+f.size,0);
  $('#homeFilesSummary').textContent = total===0 ? t('home.files.empty') : t('vault.count',{n:total})+'  ·  '+fmtBytes(bytes);
  const icEl=$('#homeFilesIc');
  icEl.classList.toggle('on', total>0);
  icEl.querySelector('.i').className = 'i i26 '+(total>0?'accent':'dim')+' i-database';
  const counts={};
  if(!S.vaultEmpty) FILES.forEach(f=>counts[f.cat]=(counts[f.cat]||0)+1);
  $('#homeChips').innerHTML = Object.entries(counts).map(function(e){
    return '<span class="minichip cat-'+e[0]+'"><span class="i i16 '+CATICON[e[0]]+'"></span><span class="n">'+e[1]+'</span></span>';
  }).join('');
  $('#homeMethodIc').innerHTML = '<span class="i i22 accent '+(S.method==='password'?'i-keyOutline':S.method==='pin'?'i-dialpad':'i-gesture')+'"></span>';
  const rows=[['i-lockOutline','home.protection.autolock'],['i-security','settings.privacy.p1'],['i-lockReset','settings.privacy.p3']];
  if(S.bio) rows.push(['i-fingerprint','home.protection.bio']);
  $('#homeProtection').innerHTML = rows.map(function(r){
    return '<div style="display:flex;gap:12px;margin-top:8px"><span class="i i18 accent '+r[0]+'" style="margin-top:2px"></span><span class="card-text" style="flex:1">'+t(r[1])+'</span></div>';
  }).join('');
}
/* ========= render-all ========= */
function renderAll(){
  renderFeatures(); renderSetup(); renderLock(); renderHome(); renderVault(); renderDetail(); renderSettings();
  $('#demoHint').textContent = S.lang==='fr'
    ? 'Aperçu interactif de la refonte UI — basculez les écrans et la langue.'
    : 'Interactive preview of the UI redesign — switch screens and language.';
  $('#demoEmpty').classList.toggle('on', S.vaultEmpty);
  $('#demoSelect').classList.toggle('on', S.selection);
  $('#demoBio').textContent = 'Fingerprint: '+(S.bio?'on':'off');
  $('#demoBio').classList.toggle('on', S.bio);
}

/* ========= events ========= */
document.addEventListener('click', e=>{
  const g=e.target.closest('[data-goto]'); if(g){ goto(g.dataset.goto); }
  const l=e.target.closest('[data-setlang]'); if(l){ S.lang=l.dataset.setlang; applyLang(); }
});
$('#setupBack').onclick=setupBackFn;
$('#setupCta').onclick=setupNext;
$$('#setupMethod .method').forEach(m=> m.onclick=()=>{ S.setupChosen=m.dataset.method; renderSetup(); });
$('#bioBtn').onclick=()=>{ $('#lockError').style.display=''; $('#lockErrorText').textContent=t('lock.bio.failed',{method:methodWord()}); };
$('#pwUnlock').onclick=()=>tryUnlock($('#pwLock').value);
$('#patUnlock').onclick=()=>tryUnlock(window.__lockPattern||'');
$('#vaultSearch').oninput=e=>{ S.q=e.target.value; renderVault(); };

    b.textContent=t('vault.sort.'+m);
    b.onclick=()=>{ S.sort=m; closeSortMenu(); renderVault(); };
    menu.appendChild(b);
  });
  $('.frame').appendChild(menu);
};
function closeSortMenu(){ const m=$('#sortMenu'); if(m)m.remove(); }
document.addEventListener('click', e=>{ if(!e.target.closest('#sortMenu')) closeSortMenu(); });
$('#selClose').onclick=()=>{ S.selection=false; S.selected.clear(); renderVault(); };
$('#selRestore').onclick=()=>{ const n=S.selected.size; S.selection=false; S.selected.clear(); banner($('#vaultBanner'),'ok',t('vault.banner.restored',{n})); renderVault(); };
$('#selDelete').onclick=()=>{ const n=S.selected.size; S.selection=false; S.selected.clear(); banner($('#vaultBanner'),'ok',t('vault.banner.deleted',{n})); renderVault(); };
$('#fab').onclick=()=>banner($('#vaultBanner'),'ok',t('vault.banner.imported',{n:2})+' '+t('vault.banner.moved',{n:2}));
$('#homeAdd').onclick=()=>{ goto('vault'); banner($('#vaultBanner'),'ok', t('vault.banner.imported',{n:2})+' '+t('vault.banner.moved',{n:2})); };
$('#demoLang').onclick=()=>{ S.lang=S.lang==='en'?'fr':'en'; applyLang(); };
$('#demoEmpty').onclick=()=>{ S.vaultEmpty=!S.vaultEmpty; renderAll(); };
$('#demoSelect').onclick=()=>{ S.selection=!S.selection; if(!S.selection)S.selected.clear(); else if(S.selected.size===0)S.selected.add(0); renderAll(); };
$('#demoBio').onclick=()=>{ S.bio=!S.bio; renderAll(); };

/* setup pads */
buildPad('#pinPad1', d=>{ if(S.setupPin.length<6){S.setupPin+=d; renderSetup();} }, ()=>{ S.setupPin=S.setupPin.slice(0,-1); renderSetup(); });
buildPad('#pinPad2', d=>{ if(S.setupPin2.length<6){S.setupPin2+=d; renderSetup();} }, ()=>{ S.setupPin2=S.setupPin2.slice(0,-1); renderSetup(); });
buildPattern('#patternGrid1', ()=>S.setupPattern, v=>{S.setupPattern=v; renderSetup();});
buildPattern('#patternGrid2', ()=>S.setupPattern2, v=>{S.setupPattern2=v; renderSetup();});

/* init */
applyLang();
goto('welcome');
</script>
