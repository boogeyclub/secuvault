<GridLayout rows="auto,*" class="page">

  <!-- Top bar -->
  <GridLayout row="0" rows="auto" columns="auto,*,auto" class="top-bar">
    <GridLayout col="0" class="icon-btn" (tap)="back()">
      <Label [text]="ic.arrowLeft" class="ic ic-22"></Label>
    </GridLayout>
    <Label col="1" [text]="i18n.t('settings.title')" class="top-bar-title" verticalAlignment="center"></Label>
    <Label col="2" text="" width="40"></Label>
  </GridLayout>

  <ScrollView row="1">
    <StackLayout class="p-lg">

      <!-- LANGUAGE -->
      <Label [text]="i18n.t('settings.section.language')" class="eyebrow"></Label>
      <StackLayout class="card">
        <GridLayout rows="auto" columns="auto,*,auto">
          <Label col="0" [text]="ic.translate" class="ic ic-22 ic-accent" verticalAlignment="center"></Label>
          <Label col="1" [text]="i18n.t('lang.label')" class="card-title" marginLeft="12" verticalAlignment="center"></Label>
          <GridLayout col="2">
            <app-lang-toggle></app-lang-toggle>
          </GridLayout>
        </GridLayout>
      </StackLayout>

      <!-- LOCK -->
      <Label [text]="i18n.t('settings.section.lock')" class="eyebrow" marginTop="18"></Label>
      <StackLayout class="card card-list">
        <GridLayout rows="auto" columns="auto,*,auto" class="setting-row" (tap)="changeLock()">
          <GridLayout col="0" class="method-ic">
            <Label [text]="methodIcon()" class="ic ic-accent ic-22"></Label>
          </GridLayout>
          <StackLayout col="1" marginLeft="12">
            <Label [text]="i18n.t('settings.lock.method')" class="card-title"></Label>
            <Label [text]="methodLabel() + ' · ' + i18n.t('settings.lock.changeHint')" class="card-text" textWrap="true"></Label>
          </StackLayout>
          <Label col="2" [text]="ic.chevronRight" class="ic ic-20 chev"></Label>
        </GridLayout>
        <GridLayout rows="auto" columns="auto,*,auto" class="setting-row setting-row-last">
          <GridLayout col="0" class="method-ic">
            <Label [text]="ic.fingerprint" class="ic ic-accent ic-22" [class.muted]="!bioAvailable()"></Label>
          </GridLayout>
          <StackLayout col="1" marginLeft="12">
            <Label [text]="i18n.t('settings.lock.bio')" class="card-title"></Label>
            <Label
              [text]="i18n.t(bioAvailable() ? 'settings.lock.bioHint.ok' : 'settings.lock.bioHint.off')"
              class="card-text"
              textWrap="true"></Label>
          </StackLayout>
          <Switch col="2" [checked]="bioEnabled()" [isEnabled]="bioAvailable()" (checkedChange)="onBioChange($event)"></Switch>
        </GridLayout>
      </StackLayout>

      <!-- STORAGE -->
      <Label [text]="i18n.t('settings.section.storage')" class="eyebrow" marginTop="18"></Label>
      <StackLayout class="card">
        <GridLayout rows="auto" columns="auto,*,auto">
          <Label col="0" [text]="ic.database" class="ic ic-22 ic-accent" verticalAlignment="center"></Label>
          <Label col="1" [text]="storageLabel()" class="card-title" marginLeft="12" verticalAlignment="center"></Label>
        </GridLayout>
        <Label [text]="i18n.t('settings.storage.text')" class="card-text" textWrap="true" marginTop="8"></Label>
        <Button [text]="i18n.t('settings.storage.erase')" class="btn btn-danger btn-wide" marginTop="14" (tap)="eraseAll()"></Button>
      </StackLayout>

      <!-- PRIVACY -->
      <Label [text]="i18n.t('settings.section.privacy')" class="eyebrow" marginTop="18"></Label>
      <StackLayout class="card">
        <Label [text]="i18n.t('settings.privacy.title')" class="card-title"></Label>
        <GridLayout rows="auto" columns="auto,*" marginTop="10">
          <Label col="0" [text]="ic.security" class="ic ic-18 ic-accent" verticalAlignment="top"></Label>
          <Label col="1" [text]="i18n.t('settings.privacy.p1')" class="card-text" textWrap="true" marginLeft="12"></Label>
        </GridLayout>
        <GridLayout rows="auto" columns="auto,*" marginTop="8">
          <Label col="0" [text]="ic.syncOff" class="ic ic-18 ic-accent" verticalAlignment="top"></Label>
          <Label col="1" [text]="i18n.t('settings.privacy.p2')" class="card-text" textWrap="true" marginLeft="12"></Label>
        </GridLayout>
        <GridLayout rows="auto" columns="auto,*" marginTop="8">
          <Label col="0" [text]="ic.lockReset" class="ic ic-18 ic-accent" verticalAlignment="top"></Label>
          <Label col="1" [text]="i18n.t('settings.privacy.p3')" class="card-text" textWrap="true" marginLeft="12"></Label>
        </GridLayout>
        <GridLayout rows="auto" columns="auto,*" marginTop="8">
          <Label col="0" [text]="ic.clock" class="ic ic-18 ic-accent" verticalAlignment="top"></Label>
          <Label col="1" [text]="i18n.t('settings.privacy.p4')" class="card-text" textWrap="true" marginLeft="12"></Label>
        </GridLayout>
      </StackLayout>

      <!-- DANGER ZONE -->
      <Label [text]="i18n.t('settings.section.danger')" class="eyebrow" marginTop="18"></Label>
      <StackLayout class="card">
        <Button [text]="i18n.t('settings.danger.reset')" class="btn btn-danger btn-wide" (tap)="resetApp()"></Button>
      </StackLayout>

      <Label [text]="i18n.t('settings.about', { version: '1.0.0' })" class="footnote dim center" marginTop="22" marginBottom="8"></Label>

    </StackLayout>
  </ScrollView>
</GridLayout>
