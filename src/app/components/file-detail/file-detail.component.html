<GridLayout rows="auto,auto,*" class="page">

  <!-- Top bar -->
  <GridLayout row="0" rows="auto" columns="auto,*,auto" class="top-bar">
    <GridLayout col="0" class="icon-btn" (tap)="back()">
      <Label [text]="ic.arrowLeft" class="ic ic-22"></Label>
    </GridLayout>
    <Label col="1" [text]="i18n.t('detail.title')" class="top-bar-title" verticalAlignment="center"></Label>
    <Label col="2" text="" width="40"></Label>
  </GridLayout>

  <!-- Banner (own row) -->
  @if (banner()) {
    <GridLayout row="1" columns="auto,*" class="banner" [class.banner-ok]="banner().kind === 'ok'" [class.banner-err]="banner().kind === 'err'">
      <Label col="0" [text]="banner().kind === 'ok' ? ic.checkCircle : ic.alertCircle" class="ic ic-20" [class.ic-accent]="banner().kind === 'ok'" [class.ic-danger]="banner().kind === 'err'"></Label>
      <Label col="1" [text]="banner().text" class="banner-text" textWrap="true"></Label>
    </GridLayout>
  }

  @if (entry(); as e) {
    <ScrollView row="2">
      <StackLayout class="p-lg">

        @if (e.category === 'image') {
          <Image [src]="pathOf(e)" stretch="aspectFit" class="detail-image"></Image>
        } @else {
          <StackLayout class="center detail-badge-wrap">
            <GridLayout class="detail-badge cat-common" [class]="catClass(e)">
              <Label [text]="catIcon(e)" class="ic ic-46"></Label>
            </GridLayout>
            <Label [text]="catLabel(e)" class="footnote muted" marginTop="10"></Label>
          </StackLayout>
        }

        <Label [text]="e.name" class="title center" textWrap="true" marginTop="18"></Label>

        <StackLayout class="card" marginTop="16">
          <GridLayout rows="auto" columns="auto,*,auto" class="meta-row meta-row-line">
            <Label col="0" [text]="ic.database" class="ic ic-18 dim" verticalAlignment="center"></Label>
            <Label col="1" [text]="i18n.t('detail.size')" class="footnote muted" marginLeft="12" verticalAlignment="center"></Label>
            <Label col="2" [text]="sizeOf(e)" class="footnote" verticalAlignment="center"></Label>
          </GridLayout>
          <GridLayout rows="auto" columns="auto,*,auto" class="meta-row meta-row-line">
            <Label col="0" [text]="ic.calendar" class="ic ic-18 dim" verticalAlignment="center"></Label>
            <Label col="1" [text]="i18n.t('detail.added')" class="footnote muted" marginLeft="12" verticalAlignment="center"></Label>
            <Label col="2" [text]="dateOf(e)" class="footnote" verticalAlignment="center"></Label>
          </GridLayout>
          <GridLayout rows="auto" columns="auto,*,auto" class="meta-row">
            <Label col="0" [text]="e.moved ? ic.cellphoneLock : ic.copy" class="ic ic-18 dim" verticalAlignment="center"></Label>
            <Label col="1" [text]="i18n.t('detail.original')" class="footnote muted" marginLeft="12" verticalAlignment="center"></Label>
            <Label col="2" [text]="originalLabel(e)" class="footnote" [color]="e.moved ? '#34E8AC' : '#FFB35C'" verticalAlignment="center"></Label>
          </GridLayout>
        </StackLayout>

        <Label [text]="movedNote(e)" class="footnote muted center" textWrap="true" marginTop="10" marginLeft="16" marginRight="16"></Label>

        <Button [text]="i18n.t('detail.open')" class="btn btn-primary btn-wide" marginTop="22" (tap)="openInSystem()"></Button>

        <GridLayout rows="auto" columns="auto,*" class="btn btn-outline btn-wide btn-with-ic" (tap)="restore()">
          <Label col="0" [text]="ic.download" class="ic ic-20 ic-accent" verticalAlignment="center"></Label>
          <Label col="1" [text]="i18n.t('detail.restore')" class="body" marginLeft="10" verticalAlignment="center"></Label>
        </GridLayout>

        <GridLayout rows="auto" columns="auto,*" class="btn btn-danger btn-wide btn-with-ic" (tap)="remove()">
          <Label col="0" [text]="ic.trash" class="ic ic-20 ic-danger" verticalAlignment="center"></Label>
          <Label col="1" [text]="i18n.t('detail.delete')" class="body" [color]="'#FF7B74'" marginLeft="10" verticalAlignment="center"></Label>
        </GridLayout>

      </StackLayout>
    </ScrollView>
  }
</GridLayout>
